name: Test and publish container
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      replace_initial_v010:
        description: Replace the initial v0.1.0 release (one-time owner-authorized correction)
        type: boolean
        default: false
      expected_tag_sha:
        description: Current v0.1.0 commit SHA (required for replacement)
        type: string
        default: ''
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: docker compose -p gatearr-ci -f compose.demo.yaml up -d --build --wait
      # Run inside the Compose network so mock-emby and Mailpit resolve.
      - run: docker compose -p gatearr-ci -f compose.demo.yaml exec -T gatearr python scripts/smoke.py --mailpit http://mailpit:8025
      - if: failure()
        run: docker compose -p gatearr-ci -f compose.demo.yaml logs --no-color
      - if: always()
        run: docker compose -p gatearr-ci -f compose.demo.yaml down -v
  publish:
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    needs: verify
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify the one-time replacement lease
        if: inputs.replace_initial_v010 == true
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_TAG_SHA: ${{ inputs.expected_tag_sha }}
        run: |
          test "$(python -c 'from app.release import VERSION; print(VERSION)')" = '0.1.0'
          test "${#EXPECTED_TAG_SHA}" = '40'
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.1.0" --jq '.object.sha')
          test "$current" = "$EXPECTED_TAG_SHA"
      - name: Verify stable tag matches the application version
        if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
        run: test "$GITHUB_REF_NAME" = "v$(python -c 'from app.release import VERSION; print(VERSION)')"
      - name: Lowercase image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=0.1.0,enable=${{ inputs.replace_initial_v010 == true }}
            type=raw,value=0.1,enable=${{ inputs.replace_initial_v010 == true }}
            type=raw,value=latest,enable=${{ inputs.replace_initial_v010 == true }}
          labels: |
            org.opencontainers.image.title=Gatearr
            org.opencontainers.image.description=Your media services, one account portal
            org.opencontainers.image.licenses=MIT
      - name: Build and publish AMD64 and ARM64 images
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: GATEARR_BUILD_REVISION=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  refresh_initial_release:
    needs: [verify, publish]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.replace_initial_v010 == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Replace the first release and downloadable packages
        if: inputs.replace_initial_v010 == true
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_TAG_SHA: ${{ inputs.expected_tag_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(python -c 'from app.release import VERSION; print(VERSION)')" = '0.1.0'
          test "${#EXPECTED_TAG_SHA}" = '40'
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.1.0" --jq '.object.sha')
          test "$current" = "$EXPECTED_TAG_SHA"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/v0.1.0" -f sha="$GITHUB_SHA" -F force=true
          git archive --format=zip --prefix=gatearr/ --output=gatearr.zip HEAD
          python - <<'PYCODE'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import hashlib
          with ZipFile('gatearr-docker.zip','w',ZIP_DEFLATED) as archive:
              for name in ('compose.yaml','.env.example','.env.windows.example','UPGRADING.md','README.md'):
                  archive.write(name,'gatearr/'+name)
          Path('SHA256SUMS.txt').write_text(''.join(hashlib.sha256(Path(name).read_bytes()).hexdigest()+'  '+name+'\n' for name in ('gatearr.zip','gatearr-docker.zip')))
          PYCODE
          gh release upload v0.1.0 gatearr.zip gatearr-docker.zip SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit v0.1.0 --title 'Gatearr 0.1.0 — First public release' --notes-file RELEASE_NOTES.md --repo "$GITHUB_REPOSITORY"

  release_assets:
    needs: [verify, publish]
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Attach versioned release packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c 'from app.release import VERSION; print(VERSION)')
          test "$GITHUB_REF_NAME" = "v$version"
          git archive --format=zip --prefix=gatearr/ --output=gatearr.zip HEAD
          python - <<'PYCODE'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import hashlib
          with ZipFile('gatearr-docker.zip','w',ZIP_DEFLATED) as archive:
              for name in ('compose.yaml','.env.example','.env.windows.example','UPGRADING.md','README.md'):
                  archive.write(name,'gatearr/'+name)
          Path('SHA256SUMS.txt').write_text(''.join(hashlib.sha256(Path(name).read_bytes()).hexdigest()+'  '+name+'\n' for name in ('gatearr.zip','gatearr-docker.zip')))
          PYCODE
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Gatearr $version — Public beta" --latest --notes-file RELEASE_NOTES.md --repo "$GITHUB_REPOSITORY"
          fi
          gh release upload "$GITHUB_REF_NAME" gatearr.zip gatearr-docker.zip SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"

  publish_new_version:
    needs: [verify, publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: gatearr-stable-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Check whether this version has already been released
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYCODE'
          import json,os,re,urllib.request,urllib.error
          from app.release import VERSION
          if not re.fullmatch(r'\d+\.\d+\.\d+',VERSION):raise SystemExit('Stable version required')
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/ref/tags/v'+VERSION
          request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          try:
              with urllib.request.urlopen(request,timeout=20):fresh=False
          except urllib.error.HTTPError as error:
              if error.code!=404:raise
              fresh=True
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('fresh='+str(fresh).lower()+'\nversion='+VERSION+'\n')
          PYCODE
      - uses: docker/setup-buildx-action@v3
        if: steps.release.outputs.fresh == 'true'
      - uses: docker/login-action@v3
        if: steps.release.outputs.fresh == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the verified digest and release packages
        if: steps.release.outputs.fresh == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          test -n "$IMAGE_DIGEST"
          docker buildx imagetools create -t "$image:$VERSION" -t "$image:${VERSION%.*}" -t "$image:latest" "$image@$IMAGE_DIGEST"
          git archive --format=zip --prefix=gatearr/ --output=gatearr.zip HEAD
          python - <<'PYCODE'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          import hashlib
          with ZipFile('gatearr-docker.zip','w',ZIP_DEFLATED) as archive:
              for name in ('compose.yaml','.env.example','.env.windows.example','UPGRADING.md','README.md'):
                  archive.write(name,'gatearr/'+name)
          Path('SHA256SUMS.txt').write_text(''.join(hashlib.sha256(Path(name).read_bytes()).hexdigest()+'  '+name+'\n' for name in ('gatearr.zip','gatearr-docker.zip')))
          PYCODE
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Gatearr $VERSION — Public beta" --latest --notes-file RELEASE_NOTES.md gatearr.zip gatearr-docker.zip SHA256SUMS.txt --repo "$GITHUB_REPOSITORY"
