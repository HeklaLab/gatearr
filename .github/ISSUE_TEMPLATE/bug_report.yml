name: Report a bug in the public beta
description: Help improve Gatearr with a reproducible bug report
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Gatearr version
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem, expected behavior and steps to reproduce. Remove API keys, passwords, tokens and private domains from logs or screenshots.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Deployment and connected applications
      description: OS, Docker, reverse proxy and versions of affected applications. Use example addresses.
    validations:
      required: true
