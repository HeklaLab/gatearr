{% extends 'base.html' %}{% block content %}<section class="card narrow"><h1>{{ _("New password") }}</h1>{% include 'password_rules.html' %}<form method="post" action="/reset"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="token" value="{{ token }}"><label>{{ _("New password") }}<input type="password" name="password" required minlength="{{ password_policy.minimum if password_policy.enabled else 1 }}" maxlength="256" autocomplete="new-password"></label><label>{{ _('Confirmation') }}<input type="password" name="confirm" required minlength="{{ password_policy.minimum if password_policy.enabled else 1 }}" maxlength="256" autocomplete="new-password"></label><button>{{ _("Save") }}</button></form></section>{% endblock %}
