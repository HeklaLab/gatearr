<section class="card auth"><span class="eyebrow">{{ _('ACCOUNT RECOVERY') }}</span><h2>{{ _(block.title or 'A fresh start.') }}</h2><p>{{ _(block.body) }}</p><form method="post" action="/forgot"><input type="hidden" name="csrf" value="{{ csrf }}"><label>{{ _('Email address') }}<input type="email" name="email" required maxlength="320" autocomplete="email"></label>{% set captcha_purpose='forgot' %}{% include 'captcha_field.html' %}<button>{{ _('Email me a link →') }}</button></form><a class="small-link" href="/login">{{ _('Sign in') }}</a></section>
