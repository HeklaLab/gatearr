{% from 'avatar.html' import picture with context %}{% set target=member if member is defined else user %}<section class="card account-card" id="photo-settings" data-save-region><h2>{{ _('Profile photo') }}</h2><div class="profile-photo-editor">{{ picture(target,'large') }}<form method="post" data-dynamic="true" action="{{ '/admin/users/'+(target.id|string)+'/photo' if member is defined else '/account/photo' }}" enctype="multipart/form-data"><input type="hidden" name="csrf" value="{{ csrf }}"><label>{{ _('Choose a photo') }}<input type="file" name="icon_file" accept="image/png,image/jpeg" required></label><p class="hint">{{ _('PNG or JPEG · up to 5 MB') }}</p><button>{{ _('Update photo') }}</button></form></div><p class="hint">{{ _('Your photo is synchronized with {service}.',service=media_name) }}</p></section>
