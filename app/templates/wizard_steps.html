<nav class="wizard-steps" aria-label="{{ _('Setup progress') }}"><ol>{% for title in ['Your portal','Administrator','Applications','Email','Finish'] %}<li class="{{ 'complete' if loop.index<wizard_number else 'current' if loop.index==wizard_number else 'upcoming' }}" {% if loop.index==wizard_number %}aria-current="step"{% endif %}><span class="step-number">{{ '✓' if loop.index<wizard_number else loop.index }}</span><span>{{ _(title) }}</span></li>{% endfor %}</ol></nav>
