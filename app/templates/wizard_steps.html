<nav class="wizard-steps" aria-label="{{ _('Setup progress') }}"><ol>{% for title in ['Media server','Administrator','Seerr','Tracearr','SMTP','Finish'] %}<li class="{{ 'complete' if loop.index<wizard_number else 'current' if loop.index==wizard_number else 'upcoming' }}" {% if loop.index==wizard_number %}aria-current="step"{% endif %}><span class="step-number">{{ '✓' if loop.index<wizard_number else loop.index }}</span><span>{{ _(title) }}</span>{% if not loop.last %}<span class="step-divider" aria-hidden="true">›</span>{% endif %}</li>{% endfor %}</ol></nav><p class="wizard-caption">{{ _('Step {number} of 6',number=wizard_number) }}</p>
