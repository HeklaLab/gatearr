{% macro picker(value='link',image='') %}<div class="icon-picker" data-icon-picker data-search-label="{{ _('Search icons') }}" data-more-label="{{ _('Show more icons') }}" data-load-error="{{ _('Unable to load icons. Try again.') }}"><input type="hidden" name="icon" value="{{ value if value in fa_icons else 'link' }}"><input type="hidden" name="existing_icon" value="{{ image if image.startswith('/media/icons/') else '' }}"><div class="icon-source-fields"><label>{{ _('Upload a PNG/SVG icon') }}<input type="file" name="icon_file" accept="image/png,image/svg+xml,.png,.svg"></label><div><span class="field-label">{{ _('Font Awesome Free') }}</span><button class="secondary icon-picker-toggle" type="button" aria-expanded="false">{% if image %}<img class="app-icon" src="{{ image }}" alt="">{% else %}<i class="{{ font_icon_class(value) }}" aria-hidden="true"></i>{% endif %}<span>{{ _('Choose an icon') }}</span></button></div></div><div class="icon-picker-panel" hidden><div class="columns"><label>{{ _('Search icons') }}<input type="search" data-icon-search autocomplete="off"></label><label>{{ _('Style') }}<select data-icon-style><option value="">{{ _('All icons') }}</option><option value="solid">{{ _('Solid') }}</option><option value="regular">{{ _('Regular') }}</option><option value="brands">{{ _('Brands') }}</option></select></label></div><p class="hint" role="status"></p><div class="icon-grid" role="group" aria-label="{{ _('Choose an icon') }}"></div><button type="button" class="secondary" data-icon-more>{{ _('Show more icons') }}</button></div><p class="hint">{{ _('PNG/SVG upload or the full bundled Font Awesome Free collection. Choose an icon to replace an uploaded image.') }}</p></div>{% endmacro %}
