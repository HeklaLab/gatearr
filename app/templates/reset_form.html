<section class="card auth"><h2>{{ _(block.title or 'New password') }}</h2>{% if block.body %}<p>{{ _(block.body) }}</p>{% endif %}<form method="post" action="/reset"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="token" value="{{ token }}"><label>{{ _('New password') }}<input type="password" name="password" {% if password_policy.enabled %}aria-describedby="reset-password-rules"{% endif %} required minlength="{{ password_policy.minimum if password_policy.enabled else 1 }}" maxlength="256" autocomplete="new-password"></label>{% if password_policy.enabled %}<div class="reset-password-hint" id="reset-password-rules"><i class="fa-solid fa-circle-info" aria-hidden="true"></i>{% include 'password_rules.html' %}</div>{% endif %}<label>{{ _('Confirmation') }}<input type="password" name="confirm" required minlength="{{ password_policy.minimum if password_policy.enabled else 1 }}" maxlength="256" autocomplete="new-password"></label><button>{{ _('Save') }}</button></form></section>
