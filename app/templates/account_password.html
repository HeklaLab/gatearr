<section class="card"><h2>{{ _(block.title or 'Password') }}</h2><p class="muted">{% if user.emby_id %}{{ _("This changes your Emby account password.") }}{% else %}{{ _("Local administrator account.") }}{% endif %}</p><form method="post" action="/account/password"><input type="hidden" name="csrf" value="{{ csrf }}"><label>{{ _("Current password") }}<input type="password" name="current" required maxlength="256" autocomplete="current-password"></label><label>{{ _("New password") }}<input type="password" name="password" required minlength="{{ password_policy.minimum if password_policy.enabled else 1 }}" maxlength="256" autocomplete="new-password"></label><label>{{ _("Confirm new password") }}<input type="password" name="confirm" required minlength="{{ password_policy.minimum if password_policy.enabled else 1 }}" maxlength="256" autocomplete="new-password"></label><button>{{ _("Change password") }}</button></form><p class="hint">{% include 'password_rules.html' %} {{ _('Portal sessions will be signed out.') }}</p></section>
