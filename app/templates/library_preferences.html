{% if member is defined and tracearr_available %}{% set pref=library_preference(member) %}<section class="{{ 'account-library-preferences' if structured_profile|default(false) else 'card' }}" id="library-preferences" data-save-region>{% if not structured_profile|default(false) %}<h2>{{ _('Library notifications') }}</h2>{% endif %}<form method="post" data-dynamic="true" action="/admin/users/{{ member.id }}/library-notifications"><input type="hidden" name="csrf" value="{{ csrf }}"><label class="check"><input type="checkbox" name="statistics" {% if pref.statistics %}checked{% endif %}>{{ _('Allow personal Tracearr statistics') }}</label>{% if cfg.get('smtp_host') %}<label class="check"><input type="checkbox" name="email" {% if pref.email %}checked{% endif %} {% if not member.email %}disabled{% endif %}>{{ _('New season emails') }}</label>{% endif %}<button>{{ _('Save preferences') }}</button></form></section>{% endif %}
