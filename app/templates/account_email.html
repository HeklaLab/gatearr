<section class="card"><h2>{{ _(block.title or 'Email address') }}</h2><p class="muted">{{ user.email or _("No verified email address") }}</p><p>{{ _("Your email address lets you recover your account. Any change must be confirmed by email.") }}</p><form method="post" action="/account/email"><input type="hidden" name="csrf" value="{{ csrf }}"><label>{{ _("New address") }}<input type="email" name="email" required autocomplete="email"></label><label>{{ _("Current password") }}<input type="password" name="current" required maxlength="256" autocomplete="current-password"></label><button>{{ _("Send confirmation") }}</button></form></section>
