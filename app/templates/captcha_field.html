{% if captcha_enabled(captcha_purpose) and visual_preview %}<div class="captcha-preview" role="img" aria-label="{{ _('CAPTCHA preview') }}"><i class="fa-regular fa-square-check" aria-hidden="true"></i><span>{{ _('Verify you are human') }}<small>{{ _('Preview only') }}</small></span><i class="fa-solid fa-shield-halved" aria-hidden="true"></i></div>{% endif %}{% if captcha_enabled(captcha_purpose) and not visual_preview %}<cap-widget data-required-message="{{ _('Complete the captcha verification again.') }}" data-cap-api-endpoint="/captcha/{{ captcha_purpose }}/" lang="{{ locale }}" style="--cap-primary-color:var(--accent);--cap-background:var(--surface);--cap-color:var(--text);--cap-border-color:var(--muted)"></cap-widget><noscript><p role="alert">{{ _('JavaScript is required for captcha verification.') }}</p></noscript>{% endif %}
