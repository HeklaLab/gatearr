{% include 'permissions.html' %}<details class="card permission-tools"><summary>{{ _("Apply an existing template") }}</summary><form method="post" action="/admin/emby/copy"><fieldset {% if owner_group %}disabled{% endif %}><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="id" value="{{ member.id }}"><label>{{ _("Template user") }}<select name="source_id" required>{% for source in remote_users if source.Id != member.emby_id and not source.get('Policy',{}).get('IsAdministrator') %}<option value="{{ source.Id }}">{{ source.Name }}</option>{% endfor %}</select></label><fieldset><legend>{{ _("Items to copy") }}</legend>{% for option in options %}<label class="check"><input type="checkbox" name="copy_options" value="{{ option.Id }}">{{ option.Name }}</label>{% endfor %}</fieldset><label class="check"><input type="checkbox" name="acknowledge" required>{{ _("Replace this user’s selected settings") }}</label><button>{{ _("Apply template") }}</button></fieldset></form></details>
