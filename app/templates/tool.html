{% extends 'base.html' %}{% block content %}<h1>{{ tool|capitalize }}</h1><p><a href="/tools/{{ tool }}?standalone=1" target="_blank" rel="noopener noreferrer">{{ _('Open in a new tab') }} ↗</a></p><form id="seerr-handoff" method="post" action="{{ tool_public }}/gatearr-tool-login" target="{{ '_self' if request.query_params.get('standalone') else 'tool-frame' }}"><input type="hidden" name="ticket" value="{{ handoff_ticket }}"><button>{{ _('Connect') }}</button></form>{% if not request.query_params.get('standalone') %}<iframe class="tool-frame" name="tool-frame" title="{{ tool|capitalize }}" referrerpolicy="same-origin"></iframe>{% endif %}{% endblock %}{% block scripts %}<script src="/static/seerr-handoff.js" defer></script>{% endblock %}
