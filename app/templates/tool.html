{% extends 'base.html' %}{% block content %}<div class="tool-heading"><h1 class="user-name-avatar"><img src="/static/services/{{ tool }}.png" width="40" height="40" alt="">{{ tool|capitalize }}</h1><a class="button secondary" href="/home">← {{ _('Back to portal') }}</a></div>{% if tool_external %}<p><a class="button secondary" href="{{ tool_external }}" target="_blank" rel="noopener noreferrer">{{ _('Open in a new tab') }} ↗</a></p>{% endif %}<iframe class="tool-frame" src="{{ tool_external or ('/tools/'+tool+'/app/') }}" title="{{ tool|capitalize }}" sandbox="allow-scripts allow-same-origin allow-forms allow-downloads allow-popups" referrerpolicy="same-origin"></iframe>{% endblock %}
