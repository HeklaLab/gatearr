<section class="card auth"><h2>{{ block.title or _('Welcome') }}</h2><form method="post" action="/login"><input type="hidden" name="csrf" value="{{ csrf }}"><label>{{ _('Username') }}<input name="name" required maxlength="320" autocomplete="username"></label><label>{{ _('Password') }}<input type="password" name="password" required maxlength="256" autocomplete="current-password"></label><button>{{ _('Sign in') }} <span>→</span></button></form><a class="small-link" href="/forgot">{{ _('Forgot your password?') }}</a></section>
